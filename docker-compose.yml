# docker compose up
#   POS API + interactive docs : http://localhost:8000/docs
#   MCP server (Streamable HTTP): http://localhost:8001/mcp
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - pos-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  mcp:
    build: .
    command: ["restaurant-pos-mcp", "--http", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      POS_API_URL: http://api:8000
    ports:
      - "8001:8001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pos-data:
